[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "internal-link-analyzer"
version = "1.0.0"
description = "Orphan pages, click depth and internal link equity"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Meer Hamza", email = "meerhamza5@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11", "pandas>=1.5", "openpyxl>=3.1", "click>=8.1"]
keywords = ["seo", "internal", "link", "analyzer"]

[project.urls]
Homepage = "https://github.com/marketing-MEER/internal-link-analyzer"
"SEO Toolbox" = "https://github.com/marketing-MEER/seo-toolbox"
LinkedIn = "https://www.linkedin.com/in/meerhamza-seo"

[project.scripts]
internal-link-analyzer = "internal_link_analyzer.cli:main"

[tool.setuptools]
packages = ["internal_link_analyzer"]
